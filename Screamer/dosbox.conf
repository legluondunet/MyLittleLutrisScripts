[cpu]
core=dynamic
cycles=150000
cycleup=500
cycledown=20

[autoexec]
@echo off
mount c C
imgmount d "D\Screamer (USA).cue" -t iso -fs iso
if not exist "c:\screamer\screamer.bat" goto :install

c:\
cd c:\screamer

:launcher
cls
echo. ------------------------------------------------------
echo.	   SCREAMER - CD - DOSBOX
echo. ------------------------------------------------------
echo.
echo.	1) Play
echo.	2) Setup
echo.	3) Exit
echo.
echo. ------------------------------------------------------
echo.	Dosbox controls:
echo. ------------------------------------------------------
echo.
echo.	ALT  + RETURN - FULLSCREEN/WINDOWED
echo.	CTRL + F5     - CAPTURE SCREEN
echo.	CTRL + F10    - MOUSE LOCK/FREE
echo.	CTRL + F12/11 - INCREASE/REDUCE SPEED
echo.	CTRL + F9     - EXIT DOSBOX
echo.
echo. ------------------------------------------------------
echo.	script by legluondunet  
echo. ------------------------------------------------------
echo.
echo.	Your choice? [1-3]:

choice /s /N	/c123

if errorlevel 3 goto :exit
if errorlevel 2 goto :setup
if errorlevel 1 goto :play


:play
call screamer.bat
goto :exit

:setup
setup.exe
goto :launcher

:install
d:\
call d:\install.bat
goto :launcher

:exit
exit
