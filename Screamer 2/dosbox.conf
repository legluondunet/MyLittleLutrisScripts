[autoexec]
@echo off
mount c C
imgmount d "D\SCREAM2.cue" -t iso -fs iso
c:\
cd c:\s2

:launcher
cls
echo. ------------------------------------------------------
echo.	   SCREAMER 2 - CD - DOSBOX
echo. ------------------------------------------------------
echo.
echo.	1) Play with 3DFX rendering
echo.	2) Play with software rendering
echo.	3) Setup
echo.	4) Exit
echo.
