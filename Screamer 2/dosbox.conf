choice /s /N	/c1234

if errorlevel 4 goto :exit
if errorlevel 3 goto :setup
if errorlevel 2 goto :playsoft
if errorlevel 1 goto :play3dfx

:play3dfx
s23dfx.exe

:playsoft
START65H.EXE

:setup
SETUP.EXE

:exit
exit
